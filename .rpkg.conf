[rpkg]
preprocess_spec = True

[git]
anon_clone_url = https://github.com/%(repo_path)s

# Sources aren't mirrored to this fork's lookaside; fetch them from the real
# Fedora dist-git lookaside cache instead, since the checksums are identical.
[lookaside]
download_url = https://src.fedoraproject.org/repo/pkgs/rpms/cosmic-session/%(filename)s/%(hashtype)s/%(hash)s/%(filename)s
